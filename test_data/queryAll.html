<p class="selectme" attribute=first>Hello all!</p>
<p class="selectme" attribute=second>Hello all (2)!</p>

<form action="/submit" method="post">
    <p>Name: <input name=name value=1></p>
    <p>Comment: <input name=comment value=2></p>
    <p><button>Submit!</button></p>
</form>

<div class=divv>
	<p>First thing</p>
	<p>Second thing</p>
</div>

<script>
	try {
		var selected = document.querySelectorAll(".selectme");
		for (var i in selected) {
			console.log('handle', selected[i].handle);
			console.log('attribute', selected[i].getAttribute('attribute'));
		}
	} catch (e) {
		console.log(e);
	}

	function lengthCheck() {
	    var name = this.getAttribute("name");
	    var value = this.getAttribute("value");
	    if (value.length > 100) {
		console.log("Input " + name + " has too much text.");
	    }
	}

	var inputs = document.querySelectorAll("input");
	for (var i = 0; i < inputs.length; i++) {
	    inputs[i].addEventListener("keydown", lengthCheck);
	}

	var div = document.querySelectorAll('.divv')[0];
	for (var i = 0; i < div.children.length; i++) {
		console.log('Child', i, 'with handle', div.children[i].handle);
	}

	var after = document.createElement('p');
	console.log('After handle', after.handle);
	after.innerHTML = 'Generated After!';
	var after2 = div.appendChild(after);
	console.log('After2 handle', after2.handle);

	var before = document.createElement('p');
	before.innerHTML = 'Generated Before!';
	console.log('Before handle', before.handle);
	var before2 = div.insertBefore(before, div.children[1]);
	console.log('Before2 handle', before2.handle);
	// this should delete the other copy and have it at the start of the div
	var before3 = div.insertBefore(before, div.children[0]);
	console.log('Before3 handle', before3.handle);

</script>
